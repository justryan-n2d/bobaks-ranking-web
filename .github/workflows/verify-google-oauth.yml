name: Verify Google OAuth

on:
  push:
    branches: ["feat/phase-6-7-accounts-identity-20261005"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Supabase Google OAuth authorize endpoint
        env:
          SUPABASE_URL: https://zhrfozouzvxhpkylmpwh.supabase.co
          REDIRECT_TO: https://bobaks-ranking-web.ryan-oledan0.workers.dev/account/google-callback
        run: |
          set -euo pipefail

          set +e
          curl --fail --silent --show-error --location-trusted --max-redirs 0             -D /tmp/headers.txt             -o /tmp/body.txt             --get "$SUPABASE_URL/auth/v1/authorize"             --data-urlencode "provider=google"             --data-urlencode "redirect_to=$REDIRECT_TO"             --data-urlencode "skip_http_redirect=true"
          curl_rc=$?
          set -e

          echo "curl exit code: $curl_rc"
          cat /tmp/headers.txt

          status="$(awk 'NR==1 {print $2}' /tmp/headers.txt)"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^location:[[:space:]]*/, "", $0); print; exit}' /tmp/headers.txt | tr -d '\r')"

          test "$status" = "302"
          test "$curl_rc" = "47"
          
          case "$location" in
            https://accounts.google.com/*)
              echo "PASS: Supabase Google provider is enabled and redirects to Google."
              ;;
            *)
              echo "FAIL: unexpected OAuth redirect target: $location"
              cat /tmp/body.txt 2>/dev/null || true
              exit 1
              ;;
          esac

          echo "PASS: redirect_to was accepted: $REDIRECT_TO"
          echo "PASS: Supabase callback is used: https://zhrfozouzvxhpkylmpwh.supabase.co/auth/v1/callback"
