name: Cloudflare Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: ["feat/**"]

permissions:
  contents: read

jobs:
  preview:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: ${{github.event.pull_request.head.sha || github.sha}}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Use npm 11
        run: npm install --global npm@11

      - name: Install
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Cloudflare application
        run: npm run build:vinext

      - name: Deploy Cloudflare Preview
        id: preview
        run: |
          set -o pipefail
          PREVIEW_NAME="pr-${{github.event.pull_request.number || github.ref_name}}"
          npx wrangler preview --name "$PREVIEW_NAME" --message "PR #${{github.event.pull_request.number || 'branch'}} Gaming Analytics UI" --json 2>preview-stderr.log | tee preview.json
        env:
          CLOUDFLARE_API_TOKEN: ${{secrets.CLOUDFLARE_API_TOKEN}}
          CLOUDFLARE_ACCOUNT_ID: ${{secrets.CLOUDFLARE_ACCOUNT_ID}}

      - name: Extract Preview URL
        id: url
        shell: bash
        run: |
          PREVIEW_URL="$(jq -r '.preview_url // .url // empty' preview.json 2>/dev/null || true)"
          if [ -z "$PREVIEW_URL" ]; then
            PREVIEW_URL="$(grep -Eo 'https://[^[:space:]"]+workers.dev' preview.json preview-stderr.log | head -n1 || true)"
          fi
          if [ -z "$PREVIEW_URL" ]; then
            echo "Could not determine Cloudflare Preview URL."
            cat preview.json
            cat preview-stderr.log
            exit 1
          fi
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          {
            echo "## Cloudflare Preview"
            echo
            echo "$PREVIEW_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Chromium
        run: npx --yes playwright install --with-deps chromium

      - name: Capture Preview screenshot
        env:
          PREVIEW_URL: ${{steps.url.outputs.preview_url}}
        run: |
          npx --yes playwright screenshot --device="Desktop Chrome" "$PREVIEW_URL" preview-home.png
          npx --yes playwright screenshot --device="Desktop Chrome" "$PREVIEW_URL/rankings/live" preview-live-rankings.png
          npx --yes playwright screenshot --device="Desktop Chrome" "$PREVIEW_URL/game/1001" preview-game.png

      - name: Upload Preview evidence
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-preview-pr-${{github.event.pull_request.number || 'branch}}
          path: |
            preview.json
            preview-stderr.log
            preview-home.png
            preview-live-rankings.png
            preview-game.png
          retention-days: 7
