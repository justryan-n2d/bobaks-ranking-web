name: Cloudflare Preview Browser QA

on:
  push:
    branches: ["feat/**"]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  preview-browser-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Chromium
        run: npx --yes playwright install --with-deps chromium

      - name: Wait for Preview
        env:
          PREVIEW_URL: https://feat-gaming-analytics-ui-20261005-bobaks-ranking-web.ryan-oledan0.workers.dev
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error "$PREVIEW_URL" | grep -q "See what gamers are playing right now."; then
              exit 0
            fi
            sleep 5
          done
          echo "Preview did not become ready: $PREVIEW_URL"
          exit 1

      - name: Run Preview browser smoke
        env:
          PREVIEW_URL: https://feat-gaming-analytics-ui-20261005-bobaks-ranking-web.ryan-oledan0.workers.dev
        run: |
          cat > preview-smoke.mjs <<'EOF'
import { chromium } from "playwright";

const base = process.env.PREVIEW_URL;
const browser = await chromium.launch({ headless: true });
const desktop = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, isMobile: true });

const checks = [
  ["home", base + "/", desktop, "See what gamers are playing right now."],
  ["live", base + "/rankings/live", desktop, "Live rankings"],
  ["game", base + "/game/1001", desktop, "Game profile"],
];

for (const [name, url, page, expectedText] of checks) {
  await page.goto(url, { waitUntil: "networkidle" });
  await page.getByText(expectedText, { exact: false }).first().waitFor();
  await page.screenshot({ path: "preview-" + name + "-desktop.png", fullPage: true });
}

await mobile.goto(base + "/", { waitUntil: "networkidle" });
await mobile.getByText("See what gamers are playing right now.", { exact: false }).first().waitFor();
await mobile.screenshot({ path: "preview-home-mobile.png", fullPage: true });

await browser.close();
EOF
          node preview-smoke.mjs

      - name: Upload Preview screenshots
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-preview-browser-qa
          path: |
            preview-home-desktop.png
            preview-live-desktop.png
            preview-game-desktop.png
            preview-home-mobile.png
          retention-days: 7
