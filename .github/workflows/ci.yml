name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --global npm@11
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --global npm@11
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Unit tests
        run: npm test

  next-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --global npm@11
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Next build
        run: npm run build

  vinext-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --global npm@11
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Vinext build
        env:
          BOBAKS_DEPLOYMENT_ENV: preview
          BOBAKS_UI_DEMO_MODE: "true"
        run: npm run build:vinext