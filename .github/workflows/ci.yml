name: Frontend CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Use npm 11
        run: npm install --global npm@11
      - name: Install
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
