name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Use npm 11
        run: npm install --global npm@11
      - name: Install
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Build Cloudflare preview
        env:
          BOBAKS_DEPLOYMENT_ENV: preview
          BOBAKS_UI_DEMO_MODE: "true"
        run: npm run build:vinext

      - name: Verify generated Cloudflare Worker configuration
        run: |
          node --input-type=module - <<'EOF'
          import { readFileSync } from "node:fs";
          const config = JSON.parse(readFileSync("dist/server/wrangler.json", "utf8"));
          if (config.main !== "index.js") {
            throw new Error(`Unexpected generated Worker entrypoint: ${config.main}`);
          }

          const entry = readFileSync(new URL(`./${config.main}`, new URL("file:///home/runner/work/bobaks-ranking-web/bobaks-ranking-web/dist/server/")).pathname, "utf8");
          if (!entry.includes("sUJWU9x32VR0FEnIqkOXVa76kUGKqjTllt-_0ZLiSOA")) {
            throw new Error("Generated Worker entry does not contain the Google verification token");
          }

          console.log(`Verified generated Worker entrypoint: ${config.main}`);
          EOF

      - name: Test generated Cloudflare Worker routes
        run: |
          echo "Generated Wrangler config:"
          cat dist/server/wrangler.json
          echo "Generated Worker entrypoint:"
          ls -l dist/server/index.js

          npx wrangler dev --config dist/server/wrangler.json --local --ip 127.0.0.1 --port 4174 --log-level debug > /tmp/bobaks-worker.log 2>&1 &
          echo $! > /tmp/bobaks-worker.pid
          trap 'status=$?; if [ "$status" -ne 0 ]; then echo "Worker runtime log:"; cat /tmp/bobaks-worker.log; fi; kill "$(cat /tmp/bobaks-worker.pid)" 2>/dev/null || true; exit "$status"' EXIT

          WORKER_URL=http://127.0.0.1:4174
          ready=0
          for i in $(seq 1 30); do
            code="$(curl --silent --output /tmp/worker-home.html --write-out '%{http_code}' "$WORKER_URL/" 2>/dev/null || true)"
            if [ "$code" = "200" ]; then
              ready=1
              break
            fi
            if ! kill -0 "$(cat /tmp/bobaks-worker.pid)" 2>/dev/null; then
              echo "Wrangler dev exited before becoming ready (last HTTP code: $code)."
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "Generated Cloudflare Worker did not become reachable."
            exit 1
          fi

          failures=0
          code="$(curl --silent --output /tmp/worker-deployment.json --write-out '%{http_code}' "$WORKER_URL/api/deployment" 2>/dev/null || true)"
          if [ "$code" != "200" ]; then
            echo "Deployment marker returned HTTP $code."
            cat /tmp/worker-deployment.json 2>/dev/null || true
            failures=1
          else
            node --input-type=module - <<'EOF'
          import { readFileSync } from "node:fs";
          const payload = JSON.parse(readFileSync("/tmp/worker-deployment.json", "utf8"));
          if (payload.release !== "cloudflare-generated-worker-deploy-20261009-v2") {
            throw new Error(`Unexpected Worker deployment marker: ${JSON.stringify(payload)}`);
          }
          console.log("Generated Worker deployment marker verified.");
          EOF
          fi

          code="$(curl --silent --output /tmp/worker-sitemap.xml --write-out '%{http_code}' "$WORKER_URL/sitemap.xml" 2>/dev/null || true)"
          if [ "$code" != "200" ] || ! grep -q '<urlset' /tmp/worker-sitemap.xml; then
            echo "Generated Worker sitemap check failed with HTTP $code."
            head -c 1000 /tmp/worker-sitemap.xml 2>/dev/null || true
            failures=1
          else
            SITE_ORIGIN="$(node --input-type=module - <<'EOF'
          import { readFileSync } from "node:fs";
          const config = JSON.parse(readFileSync("dist/server/wrangler.json", "utf8"));
          process.stdout.write(String(config.vars?.BOBAKS_SITE_ORIGIN || "https://web.bobaksranking.workers.dev").replace(/\/$/, ""));
          EOF
          )"
            if ! grep -Fq "$SITE_ORIGIN/rankings/live" /tmp/worker-sitemap.xml; then
              echo "Generated Worker sitemap is missing $SITE_ORIGIN/rankings/live."
              failures=1
            else
              echo "Generated Worker sitemap verified."
            fi
          fi

          code="$(curl --silent --output /tmp/worker-live-api.json --write-out '%{http_code}' "$WORKER_URL/api/rankings/live" 2>/dev/null || true)"
          if [ "$code" != "200" ]; then
            echo "Generated Worker live ranking API returned HTTP $code."
            cat /tmp/worker-live-api.json 2>/dev/null || true
            failures=1
          elif ! node --input-type=module - <<'EOF'
          import { readFileSync } from "node:fs";
          const payload = JSON.parse(readFileSync("/tmp/worker-live-api.json", "utf8"));
          if (payload.period !== "live" || !Array.isArray(payload.data) || payload.data.length === 0) {
            throw new Error("Built Worker live ranking API returned an invalid or empty payload.");
          }
          console.log(`Generated Worker live ranking API returned ${payload.data.length} rows.`);
          EOF
          then
            failures=1
          fi

          exit "$failures"

      - name: Install Playwright Chromium
        run: npx --yes playwright install --with-deps chromium

      - name: Start browser test server
        env:
          BOBAKS_DEPLOYMENT_ENV: preview
          BOBAKS_UI_DEMO_MODE: "true"
        run: |
          npm run start:vinext -- --host 127.0.0.1 --port 4173 > /tmp/bobaks-vinext.log 2>&1 &
          echo $! > /tmp/bobaks-vinext.pid

          ready=0
          for i in $(seq 1 36); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ > /tmp/home.html; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/bobaks-vinext.log
            echo "Local browser test server did not become reachable."
            exit 1
          fi

      - name: Inspect current branch browser build
        env:
          PREVIEW_URL: http://localhost:4173
        run: |
          set -e

          for path in / /rankings/live /game/demo-001; do
            code="$(curl --silent --output /tmp/route.html --write-out '%{http_code}' "$PREVIEW_URL$path")"
            test "$code" = "200"
            test -s /tmp/route.html
          done

          grep -q "See what gamers are playing right now." /tmp/home.html
          curl --fail --silent --show-error "$PREVIEW_URL/api/rankings/live" > /tmp/live-api.json
          grep -q '"data"' /tmp/live-api.json

          # Verify the new static App Router endpoint through the built Cloudflare/Vinext server.
          # A unit test of GET() alone cannot catch a route missing from the runtime route graph.
          curl --fail --silent --show-error "$PREVIEW_URL/api/deployment" > /tmp/deployment-api.json
          node --input-type=module - <<'EOF'
          import { readFileSync } from "node:fs";
          const payload = JSON.parse(readFileSync("/tmp/deployment-api.json", "utf8"));
          if (payload.release !== "cloudflare-generated-worker-deploy-20261009-v2") {
            throw new Error(`Unexpected deployment marker payload: ${JSON.stringify(payload)}`);
          }
          console.log("Verified /api/deployment through the built Cloudflare/Vinext server.");
          EOF

          curl --fail --silent --show-error "$PREVIEW_URL/api/social/feed?period=live" > /tmp/social-api.json
          node --input-type=module - <<'EOF'
          import { readFileSync } from "node:fs";
          const payload = JSON.parse(readFileSync("/tmp/social-api.json", "utf8"));
          if (!Array.isArray(payload.trending?.items) || !Array.isArray(payload.peaks?.items)) {
            throw new Error("Social feed endpoint returned an invalid payload.");
          }
          console.log("Verified same-origin social feed API.");
          EOF

          npx --yes playwright screenshot --browser=chromium --viewport-size="1440,900" --wait-for-timeout=2000 "$PREVIEW_URL/" preview-home.png
          npx --yes playwright screenshot --browser=chromium --viewport-size="1440,900" --wait-for-timeout=2000 "$PREVIEW_URL/rankings/live" preview-live.png
          npx --yes playwright screenshot --browser=chromium --viewport-size="1440,900" --wait-for-timeout=1000 "$PREVIEW_URL/game/demo-001" preview-game.png
          npx --yes playwright screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=2000 "$PREVIEW_URL/" preview-home-mobile.png

      - name: Verify Phase 6.7 auth flows in Chromium
        if: github.event_name == 'pull_request'
        env:
          PREVIEW_URL: http://127.0.0.1:4173
        run: |
          set +e
          set -o pipefail
          npx playwright test e2e/phase-6-7-preview.spec.ts 2>&1 | tee playwright-e2e.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Stop browser test server
        if: always()
        run: |
          if [ -f /tmp/bobaks-vinext.pid ]; then
            kill "$(cat /tmp/bobaks-vinext.pid)" 2>/dev/null || true
          fi

      - name: Upload browser evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            preview-home.png
            preview-live.png
            preview-game.png
            preview-home-mobile.png
            playwright-e2e.log
          retention-days: 7
