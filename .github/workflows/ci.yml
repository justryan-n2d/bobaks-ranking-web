name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runner-smoke:
    runs-on: ubuntu-22.04
    steps:
      - name: Runner smoke
        run: |
          set -euxo pipefail
          echo "runner-ok"
          node --version
          npm --version

  checkout:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

  node-setup:
    runs-on: ubuntu-22.04
    steps:
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

  npm-global:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Upgrade npm
        run: npm install --global npm@11

  dependencies:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --global npm@11
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund