name: Production Live Probe

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Chromium
        run: npx --yes playwright install --with-deps chromium

      - name: Probe backend dependency
        env:
          BACKEND_URL: https://bobaks-ranking-api-service.ryan-oledan0.workers.dev
        run: |
          set -e
          code="$(curl --silent --output /tmp/backend-health --write-out '%{http_code}' "$BACKEND_URL/api/health")"
          echo "backend /api/health -> $code"
          cat /tmp/backend-health
          test "$code" = "200"
          code="$(curl --silent --output /tmp/backend-live --write-out '%{http_code}' "$BACKEND_URL/api/rankings/live")"
          echo "backend /api/rankings/live -> $code"
          cat /tmp/backend-live
          test "$code" = "200"
          python - <<'PY'
          import json
          raw=open("/tmp/backend-live","rb").read()
          json.loads(raw)
          print("Backend live rankings returned valid JSON.")
          PY

      - name: Probe production
        env:
          PRODUCTION_URL: https://bobaks-ranking-web.ryan-oledan0.workers.dev
        run: |
          set -e
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$PRODUCTION_URL/")" = "200"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$PRODUCTION_URL/rankings/live")" = "200"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$PRODUCTION_URL/about")" = "200"

          for i in $(seq 1 36); do
            code="$(curl --silent --output /tmp/frontend-live --write-out '%{http_code}' "$PRODUCTION_URL/api/rankings/live")"
            echo "frontend /api/rankings/live -> $code"
            if [ "$code" = "200" ]; then
              break
            fi
            sleep 10
          done
          test "$code" = "200"

          if grep -qiE 'preview-demo|Filipino Hangout|BOBAKS_UI_DEMO_MODE' /tmp/frontend-live; then
            echo "Preview/demo content detected in production API response."
            exit 1
          fi

          python - <<'PY'
          import json
          raw=open("/tmp/frontend-live","rb").read()
          payload=json.loads(raw)
          assert isinstance(payload, dict)
          assert payload.get("period") == "live"
          assert isinstance(payload.get("data"), list)
          print("Production same-origin live rankings returned valid JSON.")
          PY

      - name: Browser smoke and screenshots
        env:
          PRODUCTION_URL: https://bobaks-ranking-web.ryan-oledan0.workers.dev
        run: |
          npx --yes playwright screenshot --device="Desktop Chrome" "$PRODUCTION_URL/" production-home.png
          npx --yes playwright screenshot --device="Desktop Chrome" "$PRODUCTION_URL/rankings/live" production-live.png
          npx --yes playwright screenshot --device="Desktop Chrome" "$PRODUCTION_URL/about" production-about.png
          npx --yes playwright screenshot --browser=chromium --viewport-size="390,844" "$PRODUCTION_URL/" production-home-mobile.png

      - uses: actions/upload-artifact@v4
        with:
          name: production-live-probe
          path: |
            production-home.png
            production-live.png
            production-about.png
            production-home-mobile.png
          retention-days: 7
