name: Production QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Use npm 11
        run: npm install --global npm@11

      - name: Install
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx --yes playwright install --with-deps chromium

      - name: Wait for production deployment
        env:
          PRODUCTION_URL: https://web.bobaksranking.workers.dev
        run: |
          ready=0
          for i in $(seq 1 36); do
            if body="$(curl --fail --silent --show-error "$PRODUCTION_URL/")"; then
              ready=1
              printf '%s' "$body" > production-home.html
              break
            fi
            sleep 10
          done
          if [ "$ready" -ne 1 ]; then
            echo "Production Worker did not become reachable: $PRODUCTION_URL"
            exit 1
          fi

      - name: Check production routes APIs and demo isolation
        env:
          PRODUCTION_URL: https://web.bobaksranking.workers.dev
        run: |
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$PRODUCTION_URL/")" = "200"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$PRODUCTION_URL/rankings/live")" = "200"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$PRODUCTION_URL/about")" = "200"

          export LIVE_JSON="$(curl --fail --silent --show-error "$PRODUCTION_URL/api/rankings/live")"
          export SOCIAL_JSON="$(curl --fail --silent --show-error "$PRODUCTION_URL/api/social/feed?period=live")"

          node --input-type=module - <<'EOF'
          const live = JSON.parse(process.env.LIVE_JSON);
          const social = JSON.parse(process.env.SOCIAL_JSON);
          if (live.period !== "live" || !Array.isArray(live.data) || live.data.length === 0) {
            throw new Error("same-origin live rankings API returned an invalid or empty payload");
          }
          if (!Array.isArray(social.trending?.items) || !Array.isArray(social.peaks?.items)) {
            throw new Error("same-origin social feed API returned an invalid payload");
          }
          EOF

          if grep -qiE 'BOBAKS_UI_DEMO_MODE|preview-demo|Filipino Hangout' production-home.html; then
            echo "Preview/demo data leaked into production HTML."
            exit 1
          fi

          grep -Fq '<meta name="google-site-verification" content="sUJWU9x32VR0FEnIqkOXVa76kUGKqjTllt-_0ZLiSOA" />' production-home.html


      - name: Browser QA
        env:
          PRODUCTION_URL: https://web.bobaksranking.workers.dev
        run: |
          npx --yes playwright screenshot             --viewport-size="1440,900"             --wait-for-selector=".bobaks-rank-pill"             "$PRODUCTION_URL/" production-home.png

          npx --yes playwright screenshot             --viewport-size="1440,900"             --wait-for-selector='a[href^="/game/"]'             "$PRODUCTION_URL/rankings/live" production-live.png

          npx --yes playwright screenshot             --viewport-size="1440,900"             "$PRODUCTION_URL/about" production-about.png

          npx --yes playwright screenshot             --viewport-size="390,844"             --wait-for-selector=".bobaks-rank-pill"             "$PRODUCTION_URL/" production-home-mobile.png

      - name: Upload production evidence
        uses: actions/upload-artifact@v4
        with:
          name: bobaks-production-qa
          path: |
            production-home.html
            production-home.png
            production-live.png
            production-about.png
            production-home-mobile.png
          retention-days: 14
