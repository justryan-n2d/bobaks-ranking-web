name: Production QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Use npm 11
        run: npm install --global npm@11

      - name: Install
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx --yes playwright install --with-deps chromium

      - name: Wait for production deployment
        env:
          PRODUCTION_URL: https://bobaks-ranking-web.ryan-oledan0.workers.dev
        run: |
          ready=0
          for i in $(seq 1 36); do
            if body="$(curl --fail --silent --show-error "$PRODUCTION_URL/")"; then
              ready=1
              printf '%s' "$body" > production-home.html
              break
            fi
            sleep 10
          done
          if [ "$ready" -ne 1 ]; then
            echo "Production Worker did not become reachable: $PRODUCTION_URL"
            exit 1
          fi

      - name: Check production routes and demo isolation
        env:
          PRODUCTION_URL: https://bobaks-ranking-web.ryan-oledan0.workers.dev
        run: |
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$PRODUCTION_URL/")" = "200"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$PRODUCTION_URL/rankings/live")" = "200"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$PRODUCTION_URL/about")" = "200"
          if grep -qiE 'BOBAKS_UI_DEMO_MODE|preview-demo|Filipino Hangout' production-home.html; then
            echo "Preview/demo data leaked into production HTML."
            exit 1
          fi

      - name: Browser QA
        env:
          PRODUCTION_URL: https://bobaks-ranking-web.ryan-oledan0.workers.dev
        run: |
          npx --yes playwright screenshot --device="Desktop Chrome" "$PRODUCTION_URL/" production-home.png
          npx --yes playwright screenshot --device="Desktop Chrome" "$PRODUCTION_URL/rankings/live" production-live.png
          npx --yes playwright screenshot --device="Desktop Chrome" "$PRODUCTION_URL/about" production-about.png
          npx --yes playwright screenshot --browser=chromium --viewport-size="390,844" "$PRODUCTION_URL/" production-home-mobile.png

      - name: Upload production evidence
        uses: actions/upload-artifact@v4
        with:
          name: bobaks-production-qa
          path: |
            production-home.html
            production-home.png
            production-live.png
            production-about.png
            production-home-mobile.png
          retention-days: 14
