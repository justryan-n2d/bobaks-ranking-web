name: Frontend CI diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  diagnostic:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Write diagnostic
        run: |
          mkdir -p .ci-debug
          printf '%s\n' "Diagnostic runner reached this step for commit $GITHUB_SHA" > .ci-debug/harness.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci-debug/harness.txt
          git commit -m "chore: record diagnostic harness [skip ci]"
          git push origin "HEAD:$GITHUB_HEAD_REF"