name: Frontend CI diagnostic

on:
  push:
    branches: ["feat/phase-6-7-accounts-identity-20261005"]

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global npm@11
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

  test:
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global npm@11
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Unit tests
        run: npm test

  next-build:
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global npm@11
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Next build
        run: npm run build

  vinext-build:
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global npm@11
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Vinext build
        env:
          BOBAKS_DEPLOYMENT_ENV: preview
          BOBAKS_UI_DEMO_MODE: "true"
        run: npm run build:vinext